<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Profile</title>

<!-- FAVICON - Full Package -->
    <!-- ========================================== -->
    <link rel="icon" type="image/x-icon" href="../static/favicon_io/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="../static/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../static/favicon_io/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../static/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../static/favicon_io/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../static/favicon_io/android-chrome-512x512.png">
    <link rel="manifest" href="../static/favicon_io/site.webmanifest">

<style>

    body{
        background:#f5f5f5;
        font-family:Poppins,sans-serif;
    }

    .container{

        width:500px;

        margin:60px auto;

        background:white;

        padding:40px;

        border-radius:20px;

        box-shadow:0 5px 20px rgba(0,0,0,.1);
    }

    h1{

        text-align:center;

        color:#3e2c21;

        margin-bottom:30px;
    }

    input{

        width:100%;

        padding:12px;

        margin:10px 0;

        border:1px solid #ddd;

        border-radius:10px;
    }

    button{

        width:100%;

        padding:12px;

        background:#3e2c21;

        color:white;

        border:none;

        border-radius:10px;

        cursor:pointer;
    }

</style>


</head>

<body>

<div class="container">


<h1>Edit Profile</h1>

<form
    action="/edit-profile"
    method="POST"
    enctype="multipart/form-data">

    <input
        type="text"
        name="name"
        value="{{ user[1] }}"
        required>

    <input
        type="file"
        name="image">

    <button type="submit">
        Update Profile
    </button>

</form>


</div>

</body>

</html>
